name: 'proxy'
services:
    manager:
        image: 'jc21/nginx-proxy-manager:2.17.0@sha256:9cdfebbcbb6a70b84c538e6e39862c5d627171e5f4ea4bfda933f7643e3640a4'
        restart: 'always'
        # Don't bother with extra_hosts, Nginx does not use it. Use host network instead.
        network_mode: 'host'
        healthcheck:
            test: ['CMD', '/bin/check-health']
            interval: '10s'
            timeout: '3s'
        # Technically these are ignored in "host" network mode,
        # but always good to reference them in config.
        ports:
            - target: 80
              published: 80
              protocol: 'tcp'
              mode: 'host'
            - target: 443
              published: 443
              protocol: 'tcp'
              mode: 'host'
            - target: 81
              published: 81
              protocol: 'tcp'
              mode: 'host'
        volumes:
            - type: 'volume'
              source: 'hosts'
              target: '/data'
              read_only: false
            - type: 'volume'
              source: 'certs'
              target: '/etc/letsencrypt'
              read_only: false

volumes:
    hosts:
        driver: 'local'
    certs:
        driver: 'local'
