name: 'location'
services:
  # Database Setup
  # ==============
  #   CREATE USER dawarich WITH ENCRYPTED PASSWORD '<password>';
  #   CREATE DATABASE dawarich;
  #   \c dawarich
  #   ALTER DATABASE dawarich OWNER TO dawarich;
  #   CREATE EXTENSION postgis CASCADE;
  dawarich:
    image: 'freikin/dawarich:1.18.1@sha256:a2b93286a973b2e4b55d6a1ebd8009a65b8624639687ca95e909d0aac27324f5'
    stdin_open: true
    tty: true
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'SETUID', 'SETGID']
    networks:
      - 'cache'
      - 'database'
      - 'default'
    ports:
      - target: 3000
        published: 3562
        host_ip: '127.0.0.1'
        protocol: 'tcp'
    secrets:
      - source: 'dbpass'
        target: 'DATABASE_PASSWORD'
      - source: 'secretkey'
        target: 'SECRET_KEY_BASE'
    configs:
      - source: 'secretsexec'
        target: '/secrets-exec.sh'
        mode: 0555
    entrypoint: ['/bin/sh', '/secrets-exec.sh', 'web-entrypoint.sh']
    command: ['bin/rails', 'server', '-p', '3000', '-b', '::']
    environment:
      PUID: '1000'
      PGID: '1000'
      TIME_ZONE: 'Europe/Amsterdam'
      RAILS_ENV: 'production'
      REDIS_URL: 'redis://valkey:6379'
      RAILS_CACHE_DB: '2'
      RAILS_JOB_QUEUE_DB: '3'
      RAILS_WS_DB: '4'
      RACK_ATTACK_REDIS_DB: '5'
      DATABASE_HOST: 'postgres'
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: 'dawarich'
      DATABASE_NAME: 'dawarich'
      APPLICATION_HOSTS: 'location.lan.zanbaldwin.com,location.wan.zanbaldwin.com,localhost,::1,127.0.0.1'
      # Must stay 'http': TLS terminates at the proxy, and 'https' enables
      # Rails force_ssl which 301s the plain-HTTP healthcheck (dawarich#1454).
      APPLICATION_PROTOCOL: 'http'
      PROMETHEUS_EXPORTER_ENABLED: 'false'
      RAILS_LOG_TO_STDOUT: 'true'
      SELF_HOSTED: 'true'
      STORE_GEODATA: 'true'
      PHOTON_API_HOST: 'photon:2322'
      PHOTON_API_USE_HTTPS: 'false'
      # One preloaded Puma worker is plenty for a household instance and
      # halves idle memory. Raise for busier instances.
      WEB_CONCURRENCY: '1'
      ### OTP encryption keys are required if you want to use 2FA
      # OTP_ENCRYPTION_PRIMARY_KEY: ''
      # OTP_ENCRYPTION_DETERMINISTIC_KEY: ''
      # OTP_ENCRYPTION_KEY_DERIVATION_SALT: ''
      ### Upgrading to v1.18.x
      SKIP_VISITS_FLEET_REDETECT: '1'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/dawarich/public'
        target: '/var/app/public'
        read_only: false
      - type: 'bind'
        source: '/mnt/fast/apps/dawarich/watched'
        target: '/var/app/tmp/imports/watched'
        read_only: false
      - type: 'bind'
        source: '/mnt/tank4/dawarich/storage'
        target: '/var/app/storage'
        read_only: false
      - type: 'bind'
        source: '/mnt/fast/apps/dawarich/data'
        target: '/dawarich_db_data'
        read_only: true
    healthcheck:
      test: ['CMD-SHELL', "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"]
      interval: '10s'
      retries: 30
      start_period: '30s'
      timeout: '10s'
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: 5
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: '4G'

  dawarich_sidekiq:
    image: 'freikin/dawarich:1.18.1@sha256:a2b93286a973b2e4b55d6a1ebd8009a65b8624639687ca95e909d0aac27324f5'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/dawarich/public'
        target: '/var/app/public'
        read_only: false
      - type: 'bind'
        source: '/mnt/fast/apps/dawarich/watched'
        target: '/var/app/tmp/imports/watched'
        read_only: false
      - type: 'bind'
        source: '/mnt/tank4/dawarich/storage'
        target: '/var/app/storage'
        read_only: false
    networks:
      - 'cache'
      - 'database'
      - 'default'
    stdin_open: true
    tty: true
    secrets:
      - source: 'dbpass'
        target: 'DATABASE_PASSWORD'
      - source: 'secretkey'
        target: 'SECRET_KEY_BASE'
    configs:
      - source: 'secretsexec'
        target: '/secrets-exec.sh'
        mode: 0555
    entrypoint: ['/bin/sh', '/secrets-exec.sh', 'sidekiq-entrypoint.sh']
    command: ['sidekiq']
    restart: unless-stopped
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'SETUID', 'SETGID']
    environment:
      ### To run under a non-root user, set PUID/PGID here (do NOT use `user:`).
      PUID: '1000'
      PGID: '1000'
      TIME_ZONE: 'Europe/Amsterdam'
      RAILS_ENV: 'production'
      REDIS_URL: 'redis://valkey:6379'
      RAILS_CACHE_DB: '2'
      RAILS_JOB_QUEUE_DB: '3'
      RAILS_WS_DB: '4'
      RACK_ATTACK_REDIS_DB: '5'
      DATABASE_HOST: 'postgres'
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: 'dawarich'
      DATABASE_NAME: 'dawarich'
      APPLICATION_HOSTS: 'location.lan.zanbaldwin.com,location.wan.zanbaldwin.com,localhost,::1,127.0.0.1'
      # 3 job threads keep idle memory and DB connections low; raise
      # temporarily for large imports.
      BACKGROUND_PROCESSING_CONCURRENCY: '3'
      APPLICATION_PROTOCOL: 'http'
      PROMETHEUS_EXPORTER_ENABLED: 'false'
      RAILS_LOG_TO_STDOUT: 'true'
      SELF_HOSTED: 'true'
      STORE_GEODATA: 'true'
      PHOTON_API_HOST: 'photon:2322'
      PHOTON_API_USE_HTTPS: 'false'
      ### OTP encryption keys are required if you want to use 2FA
      # OTP_ENCRYPTION_PRIMARY_KEY: ''
      # OTP_ENCRYPTION_DETERMINISTIC_KEY: ''
      # OTP_ENCRYPTION_KEY_DERIVATION_SALT: ''
      ### Upgrading to v1.18.x
      SKIP_VISITS_FLEET_REDETECT: '1'
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: 5
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f sidekiq']
      interval: '10s'
      retries: 30
      start_period: '30s'
      timeout: '10s'
    depends_on:
      dawarich:
        condition: 'service_healthy'
        restart: true

  photon:
    image: 'rtuszik/photon-docker:2.5.0@sha256:c5babeb0ac396b485822036cf3c69e54fb6c79d699328a4e042e11bbd6f73f1a'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'SETUID', 'SETGID']
    networks:
      - 'default'
    environment:
      PUID: '1000'
      PGID: '1000'
      REGION: 'planet'
      UPDATE_STRATEGY: 'SEQUENTIAL'
      UPDATE_INTERVAL: '30d'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/dawarich/geodata'
        target: '/photon/data'
        read_only: false
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: 5

  # Protomaps vector tiles. Every `<name>.pmtiles` in the directory is served at
  # `/<name>/{z}/{x}/{y}.mvt`, with TileJSON at `/<name>.json`. The `basemap`
  # service publishes them; this one is not exposed directly.
  #
  # Archives: `nl` (z0-15), `regions` (England and British Columbia, z0-15) and
  # `world` (z0-10). Created and refreshed by `nas/cron/update-map-tiles.sh`.
  tiles:
    image: 'protomaps/go-pmtiles:v1.31.2@sha256:06574f01f55a78f78f887bc7ebf729a5c093c0d6e17d9876300cfcb0758b59d3'
    restart: 'unless-stopped'
    user: '1000:1000'
    cap_drop: ['ALL']
    deploy:
      resources:
        limits:
          memory: '256M'
    # No healthcheck: the image is distroless with no shell, so a CMD
    # healthcheck cannot run.
    command:
      - 'serve'
      - '/data'
      - '--port=8080'
      - '--cors=https://location.lan.zanbaldwin.com,https://location.wan.zanbaldwin.com'
      - '--public-url=https://maps.lan.zanbaldwin.com'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/dawarich/tiles'
        target: '/data'
        read_only: true

  # Combines the tile archives behind one URL: `/{z}/{x}/{y}.mvt` tries `nl`,
  # then `regions`, then `world`, moving on when an archive has no tile (204).
  # Every other path passes through to `tiles` unchanged.
  #
  # Dawarich: Map settings > Custom basemap URL
  #   https://maps.lan.zanbaldwin.com/{z}/{x}/{y}.mvt
  basemap:
    image: 'caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f'
    restart: 'unless-stopped'
    user: '1000:1000'
    cap_drop: ['ALL']
    # The caddy binary has a file capability; exec fails without this.
    cap_add: ['NET_BIND_SERVICE']
    deploy:
      resources:
        limits:
          memory: '64M'
    configs:
      - source: 'basemap'
        target: '/etc/caddy/Caddyfile'
    ports:
      - target: 8080
        published: 6277
        host_ip: '127.0.0.1'
        protocol: 'tcp'
    depends_on:
      - 'tiles'

networks:
  default: {}
  cache:
    external: true
  database:
    external: true

secrets:
  dbpass:
    file: '/mnt/tank4/secrets/dawarich/dbpass'
  secretkey:
    file: '/mnt/tank4/secrets/dawarich/secretkey'

configs:
  secretsexec:
    # Exports every mounted secret as an env var named after its file (the
    # service-level `target:` name), then hands off to the real entrypoint.
    content: |
      #!/bin/sh
      set -eu
      for file in /run/secrets/*; do
          [ -f "$${file}" ] || continue
          export "$$(basename "$${file}")=$$(cat "$${file}")"
      done
      exec "$$@"
  basemap:
    content: |
      {
        admin off
        auto_https off
        persist_config off
      }

      :8080 {
        @tile path_regexp tile ^/(\d+/\d+/\d+\.mvt)$$
        handle @tile {
          rewrite * /nl/{re.tile.1}
          reverse_proxy tiles:8080 {
            @empty status 204
            handle_response @empty {
              rewrite * /regions/{re.tile.1}
              reverse_proxy tiles:8080 {
                @empty status 204
                handle_response @empty {
                  rewrite * /world/{re.tile.1}
                  reverse_proxy tiles:8080
                }
              }
            }
          }
        }
        handle {
          reverse_proxy tiles:8080
        }
      }
