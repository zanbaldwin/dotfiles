name: 'anki'
services:
    # Self-hosted Anki sync server. Pin the version to the desktop/AnkiDroid
    # clients; update the server first, then the clients (the sync protocol is
    # versioned).
    #
    # Secret: `printf 'username:<password>' > /mnt/tank4/secrets/anki/sync_user` (no newline).
    # Setup: `chown -R 1000:1000 /mnt/tank4/anki`.
    sync:
        build:
            dockerfile_inline: |
                FROM python:3.14-slim-trixie
                RUN pip install --no-cache-dir 'anki==26.9.2'
        image: 'local/anki-sync-server:26.9.2'
        restart: 'unless-stopped'
        user: '1000:1000'
        deploy:
            resources:
                limits:
                    memory: '512M'
        environment:
            TZ: 'Europe/Amsterdam'
            SYNC_BASE: '/data'
            SYNC_HOST: '0.0.0.0'
            SYNC_PORT: '8080'
            MAX_SYNC_PAYLOAD_MEGS: '100'
        secrets:
            - 'anki_sync_user'
        healthcheck:
            test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
            interval: '30s'
            timeout: '5s'
            retries: 3
        ports:
            - target: 8080
              published: 8770
              host_ip: '127.0.0.1'
              protocol: 'tcp'
        volumes:
            - type: 'bind'
              source: '/mnt/tank4/anki'
              target: '/data'
              read_only: false
        command:
            - 'sh'
            - '-c'
            - 'export SYNC_USER1="$(cat /run/secrets/anki_sync_user)"; exec python -m anki.syncserver'

secrets:
    anki_sync_user:
        file: '/mnt/tank4/secrets/anki/sync_user'
