name: 'rawr'
services:
  web:
    image: 'alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a'
    restart: 'unless-stopped'
    user: '1000:1000'
    cap_drop: ['ALL']
    command: ['/opt/rawr/rawr-web', '--bind', '0.0.0.0:7297']
    environment:
      RAWR_CONFIG: '/library/rawr.toml'
      RAWR__LIBRARY__CACHE: '/opt/rawr/cache.db'
      # Override the path configured for Desktop use.
      RAWR__TARGETS__NFS__DIRECTORY: '/library'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/rawr'
        target: '/opt/rawr'
        read_only: false
      - type: 'bind'
        source: '/mnt/tank4/books/AO3'
        target: '/library'
        read_only: false
    ports:
      - target: 7297
        published: 7297
        host_ip: '127.0.0.1'
        protocol: 'tcp'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7297/api/v1/health']
      interval: '60s'
      start_period: '10s'
