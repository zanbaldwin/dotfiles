name: 'notes'
services:

  # Database Setup
  # ==============
  #   CREATE USER anchor WITH ENCRYPTED PASSWORD '<password>';
  #   CREATE DATABASE anchor;
  #   \c anchor
  #   ALTER DATABASE anchor OWNER TO anchor;
  anchor:
    image: 'ghcr.io/zhfahim/anchor:0.18.1@sha256:83121433fcbc60f1491f1d5c761d2bac59519884ad31d0c464b7fce931d75d8e'
    restart: 'unless-stopped'
    networks: ['default', 'database', 'proxy']
    cap_drop: ['ALL']
    entrypoint: ['/bin/sh', '/secrets-exec.sh']
    command: ['/app/docker-entrypoint.sh']
    configs:
      - source: 'secretsexec'
        target: '/secrets-exec.sh'
    secrets:
      - source: 'anchor_dbpass'
        target: 'PG_PASSWORD'
      - source: 'anchor_client_id'
        target: 'OIDC_CLIENT_ID'
      - source: 'anchor_client_secret'
        target: 'OIDC_CLIENT_SECRET'
    environment:
      APP_URL: 'https://keep.wan.zanbaldwin.com'
      DATA_DIR: '/data'
      CORS_ORIGIN: 'https://keep.wan.zanbaldwin.com,https://keep.lan.zanbaldwin.com'
      PG_HOST: 'postgres'
      OIDC_ENABLED: 'true'
      OIDC_PROVIDER_NAME: 'PocketID'
      OIDC_ISSUER_URL: 'https://auth.wan.zanbaldwin.com'
    labels:
      caddy: 'keep.wan.zanbaldwin.com, keep.lan.zanbaldwin.com, notes.wan.zanbaldwin.com, notes.lan.zanbaldwin.com'
      caddy.import: 'app {{upstreams 3000}}'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/anchor'
        target: '/data'
        read_only: false

networks:
  default: {}
  database:
    external: true
  proxy:
    external: true

secrets:
  anchor_dbpass:
    file: '/mnt/tank4/secrets/anchor/dbpass'
  anchor_client_id:
    file: '/mnt/tank4/secrets/anchor/client_id'
  anchor_client_secret:
    file: '/mnt/tank4/secrets/anchor/client_secret'

configs:
  secretsexec:
    # Exports every mounted secret as an env var named after its file (the
    # service-level `target:` name), then hands off to the real entrypoint.
    content: |
      #!/bin/sh
      set -eu
      for file in /run/secrets/*; do
          [ -f "$${file}" ] || continue
          export "$$(basename "$${file}")=$$(cat "$${file}")"
      done
      exec "$$@"
