[[server]]
name = 'nas'
[server.config]
enabled = true

[[builder]]
name = 'nas'
[builder.config]
type = 'Server'
params.servers = ['nas']

[[resource_sync]]
name = 'nas-stacks'
[resource_sync.config]
linked_repo = 'dotfiles'
resource_path = ['nas/deploy.toml']
delete = true

[[repo]]
name = 'dotfiles'
[repo.config]
server = 'nas'
builder = 'nas'
git_account = 'zanbaldwin'
repo = 'zanbaldwin/dotfiles'

