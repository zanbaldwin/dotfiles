name: 'drive'
services:

  # Minimal Basic-auth-only WebDAV for iPad note apps. OpenCloud advertises a
  # Bearer challenge before Basic, which CFNetwork clients (Noteshelf 3) cannot
  # negotiate - they give up without ever sending credentials, so they can never
  # authenticate against the opencloud service above.
  webdav:
    image: 'ghcr.io/hacdias/webdav:v5.15.1'
    restart: 'unless-stopped'
    # Must match OpenCloud's uid so its posix driver can assimilate new files.
    user: '1000:1000'
    deploy:
      resources:
        limits:
          memory: '128M'
    # No healthcheck: the image is a single static binary with no shell, so a
    # CMD healthcheck cannot run.
    command: ['-c', '/config.yaml']
    environment:
      TZ: 'Europe/Amsterdam'
    volumes:
      # Holds the user list and their bcrypt passwords. Must exist before first
      # start or the container exits immediately.
      - type: 'bind'
        source: '/mnt/tank4/secrets/webdav/config.yaml'
        target: '/config.yaml'
        read_only: true
      - type: 'bind'
        source: '/mnt/tank4/drive'
        target: '/data'
        read_only: false
    ports:
      - target: 6065
        published: 6065
        host_ip: '127.0.0.1'
        protocol: 'tcp'

  # Web file manager, replacing the old read-only Next Explorer - it reuses that
  # service's port and domain. The '-stable-slim' tag drops ffmpeg (25MB vs
  # 83MB) at the cost of video and office thumbnails.
  # The image ships its own HEALTHCHECK against /health, so none is declared.
  files:
    image: 'gtstef/filebrowser:1.5.6-stable'
    restart: 'unless-stopped'
    # The image's own user is already uid 1000, matching OpenCloud, so files
    # created from the web UI get ownership the posix driver expects.
    user: '1000:1000'
    deploy:
      resources:
        limits:
          memory: '512M'
    configs:
      - source: 'filebrowser'
        target: '/config.yaml'
    environment:
      TZ: 'Europe/Amsterdam'
      # Defaults to /home/filebrowser/data/config.yaml, i.e. inside the state
      # directory. Point it at the inlined config instead, so the state
      # directory holds only the sqlite index.
      FILEBROWSER_CONFIG: '/config.yaml'
    volumes:
      # Sqlite search index and app state.
      - type: 'bind'
        source: '/mnt/fast/apps/filebrowser'
        target: '/home/filebrowser/data'
        read_only: false
      - type: 'bind'
        source: '/mnt/tank4/drive'
        target: '/drive'
        read_only: false
    ports:
      - target: 80
        published: 3453
        host_ip: '127.0.0.1'
        protocol: 'tcp'

configs:
  # No credentials here: the initial admin is created by the binary on first
  # run, not declared in config, so this is safe to keep in git.
  filebrowser:
    content: |
      server:
        port: 80
        baseURL: '/'
        logging:
          - levels: 'info'
        sources:
          - path: '/drive'
            name: 'Drive'
            config:
              rules:
                # OpenCloud's posix driver keeps ~2,750 metadata files under
                # .oc-nodes and upload staging in .oc-tmp, both at the space
                # root. Without this they get indexed and pollute search.
                - folderStartsWith: '.oc-'
                - folderStartsWith: '.Trash'
      auth:
        methods:
          password:
            enabled: true
            signup: false
          passkey:
            enabled: false
