name: 'books'
services:
  calibre:
    image: 'ghcr.io/linuxserver/calibre-web:0.6.27@sha256:adb69d75b9c252e580fc691096f858833b901b5d106ae4080fb476bab104d946'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETUID', 'SETGID', 'KILL']
    environment:
      TZ: 'Europe/Amsterdam'
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
    ports:
      - target: 8083
        published: 8083
        host_ip: '127.0.0.1'
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/mnt/tank4/books/Calibre'
        target: '/books'
        read_only: true
      - type: 'bind'
        source: '/mnt/fast/apps/calibre'
        target: '/config'
        read_only: false

  audiobookshelf:
    image: 'ghcr.io/advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3'
    restart: 'unless-stopped'
    user: '1000:1000'
    cap_drop: ['ALL']
    environment:
      TZ: 'Europe/Amsterdam'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/healthcheck']
      interval: '60s'
      timeout: '5s'
      retries: 3
      start_period: '30s'
    ports:
      - target: 80
        published: 2834
        host_ip: '127.0.0.1'
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/mnt/tank4/books/Audiobooks'
        target: '/audiobooks'
        read_only: true
      - type: 'bind'
        source: '/mnt/fast/apps/audiobookshelf/config'
        target: '/config'
        read_only: false
      - type: 'bind'
        source: '/mnt/fast/apps/audiobookshelf/metadata'
        target: '/metadata'
        read_only: false
