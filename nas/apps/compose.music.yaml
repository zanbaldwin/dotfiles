name: 'music'
services:
    navidrome:
        image: 'deluan/navidrome:0.64.0'
        restart: 'unless-stopped'
        user: '1000:1000'
        environment:
            TZ: 'Europe/Amsterdam'
            # Environment variables have a higher priority than configuration files.
            # Navidrome's Docker image defines ND_MUSICFOLDER as `/music` so we have to override it.
            ND_MUSICFOLDER: '/var/empty'
            ND_LASTFM_APIKEY: 'cdd6ee6c6fb2d399252e19e0e6f23980'
        configs:
            - source: 'navidrome'
              target: '/data/navidrome.toml'
            - source: 'secretsexec'
              target: '/secrets-exec.sh'
              mode: 0555
        secrets:
            - source: 'lastfm'
              target: 'ND_LASTFM_SECRET'
        entrypoint: ['/bin/sh', '/secrets-exec.sh']
        command: ['navidrome', '--configfile', '/data/navidrome.toml']
        ports:
            - target: 4533
              published: 4533
              host_ip: '127.0.0.1'
              protocol: 'tcp'
        volumes:
            - type: 'bind'
              source: '/mnt/fast/apps/navidrome'
              target: '/data'
              read_only: false
            - type: 'bind'
              source: '/mnt/tank4/music'
              target: '/music'
              read_only: true
            - type: 'bind'
              source: '/mnt/tank4/books/Audible'
              target: '/books'
              read_only: true

    spindle:
        image: 'ghcr.io/xmorose/spindle:0.3.2'
        restart: 'unless-stopped'
        user: '1000:1000'
        environment:
            WEB_DIR: '/app/web'
            STATS_DB_PATH: '/app/data/stats.db'
            COVER_CACHE_DIR: '/app/data/covers'
            NAVIDROME_DB_PATH: '/nddata/navidrome.db'
            DEFAULT_USER: 'zanbaldwin'
            NAVIDROME_URL: 'http://navidrome:4533'
            NAVIDROME_USER: 'zanbaldwin'
        configs:
            - source: 'secretsexec'
              target: '/secrets-exec.sh'
              mode: 0555
        secrets:
            - source: 'spindle_ingest'
              target: 'INGEST_SECRET'
            - source: 'user_password'
              target: 'NAVIDROME_PASSWORD'
        entrypoint: ['/bin/sh', '/secrets-exec.sh']
        command: ['node', 'dist/server.js']
        ports:
            - target: 3590
              published: 3590
              host_ip: '127.0.0.1'
              protocol: 'tcp'
        volumes:
            - type: 'bind'
              source: '/mnt/fast/apps/spindle'
              target: '/app/data'
              read_only: false
            - type: 'bind'
              source: '/mnt/fast/apps/navidrome'
              target: '/nddata'
              read_only: true

secrets:
    lastfm:
        file: '/mnt/tank4/secrets/lastfm/api_secret'
    spindle_ingest:
        file: '/mnt/tank4/secrets/navidrome/spindle_ingest'
    user_password:
        file: '/mnt/tank4/secrets/navidrome/default_user_password'

configs:
    secretsexec:
        # Exports every mounted secret as an env var named after its file (the
        # service-level `target:` name), then hands off to the real entrypoint.
        content: |
            #!/bin/sh
            set -eu
            for file in /run/secrets/*; do
                [ -f "$${file}" ] || continue
                export "$$(basename "$${file}")=$$(cat "$${file}")"
            done
            exec "$$@"
    navidrome:
        content: |
            LogLevel = 'WARNING'
            Scanner.Schedule = '@every 24h'
            # Default library for all users `/var/empty`; Legacy `/music/legacy`; Modern `/music/modern`.
            MusicFolder = '/var/empty'
            DataFolder = '/data'
            CacheFolder = '/data/cache'
            Address = '0.0.0.0'
            BaseUrl = 'https://music.lan.zanbaldwin.com'
            Port = 4533
            EnableInsightsCollector = false
            Tags.Artist.Split = [' / ', ' feat. ', ' feat ', ' ft. ', ' ft ', '; ', ', ']
            Tags.AlbumArtist.Split = [' / ', ' feat. ', ' feat ', ' ft. ', ' ft ', '; ', ', ']
            Scanner.ArtistSplitExceptions = ['ABBA (Björn, Benny, Agnetha & Frida)', 'Blood, Sweat & Tears', 'Woe, Is Me', 'The Chapel Choir of Pembroke College, Cambridge', 'Mr. Garrison, The 3rd Grade Teacher']
            Agents = 'lastfm,deezer'
