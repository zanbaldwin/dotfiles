name: 'network'
services:

  tailscale:
    image: 'tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4'
    restart: 'unless-stopped'
    network_mode: 'host'
    environment:
      TS_AUTHKEY: 'file:/run/secrets/authkey'
      TS_STATE_DIR: '/var/lib/tailscale'
      TS_AUTH_ONCE: 'true'
      TS_ENABLE_HEALTH_CHECK: 'true'
      TS_LOCAL_ADDR_PORT: '0.0.0.0:8575'
      # To forward to subnets, use kernel networking with the following options:
      # # /etc/sysctl.d/99-tailscale.conf
      # net.ipv4.ip_forward = 1
      # net.ipv6.conf.all.forwarding = 1
      TS_ROUTES: '192.168.1.0/24'
      TS_EXTRA_ARGS: '--advertise-exit-node'
      TS_USERSPACE: 'false'
      TS_NO_LOGS_NO_SUPPORT: 'true'
      TS_SERVE_CONFIG: '/config/serve.json'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q "http://127.0.0.1:8575/healthz"']
      interval: '30s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
    configs:
      - source: 'serve'
        target: '/config/serve.json'
    secrets:
      - 'authkey'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/tailscale'
        target: '/var/lib/tailscale'
        read_only: false
    devices:
      - '/dev/net/tun:/dev/net/tun'
    cap_drop: ['ALL']
    cap_add: ['NET_ADMIN', 'NET_RAW', 'SYS_MODULE']

  manager:
    image: 'jc21/nginx-proxy-manager:2.17.1@sha256:04a9d0835560b9719ab577275f84fe1f713298a1c1e2bdefa034b87f10e062e1'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'NET_BIND_SERVICE', 'SETUID', 'SETGID']
    # Don't bother with extra_hosts, Nginx does not use it. Use host network instead.
    network_mode: 'host'
    healthcheck:
      test: ['CMD', '/bin/check-health']
      interval: '10s'
      timeout: '3s'
    secrets:
      - 'cloudflare'
    # Technically these are ignored in "host" network mode,
    # but always good to reference them in config.
    ports:
      - target: 80
        published: 80
        protocol: 'tcp'
      - target: 443
        published: 443
        protocol: 'tcp'
      - target: 81
        published: 81
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/proxy/config'
        target: '/data'
        read_only: false
      - type: 'bind'
        source: '/mnt/fast/apps/proxy/certs'
        target: '/etc/letsencrypt'
        read_only: false

  manager_new:
    build:
      context: '.'
      dockerfile_inline: |
        FROM caddy:2.11.9-builder-alpine AS builder
        RUN xcaddy build --with github.com/caddy-dns/cloudflare
        FROM caddy:2.11.9-alpine
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    image: 'lan.zanbaldwin.com/caddy-cloudflare:2.11.9'
    restart: 'unless-stopped'
    network_mode: 'host'
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE']
    secrets: [ 'cloudflare' ]
    configs:
      - source: 'caddyfile'
        target: '/etc/caddy/Caddyfile'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/caddy/data'
        target: '/data'
        read_only: false
      - type: 'bind'
        source: '/mnt/fast/apps/caddy/config'
        target: '/config'
        read_only: false

  # Database Setup
  # ==============
  #   CREATE USER pocketid WITH ENCRYPTED PASSWORD '<password>';
  #   CREATE DATABASE pocketid;
  #   \c pocketid
  #   ALTER DATABASE pocketid OWNER TO pocketid;
  #   ALTER SCHEMA public OWNER TO pocketid;
  #
  # Secrets:
  #   printf 'postgres://pocketid:<password>@postgres:5432/pocketid?sslmode=disable' > /mnt/tank4/secrets/pocketid/dsn
  #   openssl rand -base64 32 | tr -d '\n' > /mnt/tank4/secrets/pocketid/encryption_key
  #
  # Losing `encryption_key` makes the stored signing keys unreadable.
  # Visit /setup straight away to register the admin passkey.
  pocketid:
    image: 'ghcr.io/pocket-id/pocket-id:v2.19.3-distroless@sha256:6a0045a89b80fa6624c091786e7be132a4dde880ca64727a6b019c056b091982'
    restart: 'unless-stopped'
    user: '1000:1000'
    cap_drop: ['ALL']
    networks:
      - 'database'
    environment:
      TZ: 'Europe/Amsterdam'
      APP_URL: 'https://auth.wan.zanbaldwin.com'
      TRUST_PROXY: 'true'
      ANALYTICS_DISABLED: 'true'
      DB_CONNECTION_STRING_FILE: '/run/secrets/pocketid_dsn'
      ENCRYPTION_KEY_FILE: '/run/secrets/pocketid_encryption_key'
    secrets:
      - 'pocketid_dsn'
      - 'pocketid_encryption_key'
    healthcheck:
      test: ['CMD', '/app/pocket-id', 'healthcheck']
      interval: '90s'
      timeout: '5s'
      retries: 3
      start_period: '10s'
    ports:
      - target: 1411
        published: 2884
        host_ip: '127.0.0.1'
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/pocketid'
        target: '/app/data'
        read_only: false

networks:
  database:
    external: true

secrets:
  authkey:
    file: '/mnt/tank4/secrets/tailscale'
  cloudflare:
    file: '/mnt/tank4/secrets/cloudflare'
  pocketid_dsn:
    file: '/mnt/tank4/secrets/pocketid/dsn'
  pocketid_encryption_key:
    file: '/mnt/tank4/secrets/pocketid/encryption_key'

configs:
  caddyfile:
    # Ports 9080/9443 while NPM still owns 80/443. Remove `http_port` and
    # `https_port` when Caddy replaces NPM.
    content: |
      {
        http_port 9080
        https_port 9443
        acme_dns cloudflare {file./run/secrets/cloudflare}
      }

      *.lan.zanbaldwin.com, *.wan.zanbaldwin.com {
        respond "Unknown host" 404
      }

      (app) {
        @outside {
          host *.lan.zanbaldwin.com
          not remote_ip private_ranges 100.64.0.0/10
        }
        respond @outside 403
        reverse_proxy {args[:]}
      }

      # Pihole is only local
      pihole.lan.zanbaldwin.com {
        @outside not remote_ip private_ranges 100.64.0.0/10
        respond @outside 403
        reverse_proxy https://192.168.1.74 {
          transport http {
            tls_insecure_skip_verify
          }
        }
      }

      # IMPORTANT! Must use only *ONE* domain for PocketID.
      auth.wan.zanbaldwin.com {
        import app 127.0.0.1:2884
      }

      anki.wan.zanbaldwin.com, anki.lan.zanbaldwin.com {
        import app 127.0.0.1:8770
      }
      ao3.wan.zanbaldwin.com, ao3.lan.zanbaldwin.com, rawr.wan.zanbaldwin.com, rawr.lan.zanbaldwin.com {
        import app 127.0.0.1:7297
      }
      books.wan.zanbaldwin.com, books.lan.zanbaldwin.com {
        import app 127.0.0.1:2665
      }
      keep.wan.zanbaldwin.com, keep.lan.zanbaldwin.com, notes.wan.zanbaldwin.com, notes.lan.zanbaldwin.com {
        import app 127.0.0.1:4526
      }
      music.wan.zanbaldwin.com, music.lan.zanbaldwin.com {
        import app 127.0.0.1:4533
      }
      rotter.wan.zanbaldwin.com, rotter.lan.zanbaldwin.com {
        import app 127.0.0.1:7688
      }
      scrobble.wan.zanbaldwin.com, scrobble.lan.zanbaldwin.com {
        import app 127.0.0.1:3590
      }
      photos.wan.zanbaldwin.com, photos.lan.zanbaldwin.com {
        import app 127.0.0.1:2283
      }
      nas.wan.zanbaldwin.com, nas.lan.zanbaldwin.com {
        import app 127.0.0.1:8080
      }
      backup.lan.zanbaldwin.com {
        import app 127.0.0.1:9898
      }
      deploy.wan.zanbaldwin.com, deploy.lan.zanbaldwin.com {
        import app 127.0.0.1:5666
      }
      stats.wan.zanbaldwin.com, stats.lan.zanbaldwin.com {
        import app 127.0.0.1:2379
      }
      mail.wan.zanbaldwin.com, mail.lan.zanbaldwin.com {
        import app 127.0.0.1:2424
      }
      garage.wan.zanbaldwin.com, garage.lan.zanbaldwin.com {
        import app 127.0.0.1:3909
      }
      s3.wan.zanbaldwin.com, s3.lan.zanbaldwin.com, buckets.wan.zanbaldwin.com, buckets.lan.zanbaldwin.com {
        import app 127.0.0.1:3900
      }
      drive.wan.zanbaldwin.com, drive.lan.zanbaldwin.com, files.wan.zanbaldwin.com, files.lan.zanbaldwin.com {
        import app 127.0.0.1:3453
      }
      git.wan.zanbaldwin.com, git.lan.zanbaldwin.com {
        import app 127.0.0.1:3645
      }
      location.wan.zanbaldwin.com, location.lan.zanbaldwin.com {
        import app 127.0.0.1:3562
      }
      maps.wan.zanbaldwin.com, maps.lan.zanbaldwin.com, tiles.wan.zanbaldwin.com, tiles.lan.zanbaldwin.com {
        import app 127.0.0.1:6277
      }
      sites.wan.zanbaldwin.com, sites.lan.zanbaldwin.com {
        import app 127.0.0.1:7487
      }

  serve:
    # Funnel only Komodo's webhook listener. Port 10000, not 443: proxy already
    # listens on 443 on every interface. `$$` escapes Compose interpolation;
    # containerboot replaces ${TS_CERT_DOMAIN} with the node's ts.net name.
    content: |
      {
        "TCP": {
          "10000": { "HTTPS": true }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:10000": {
            "Handlers": {
              "/listener": { "Proxy": "http://127.0.0.1:5666/listener" }
            }
          }
        },
        "AllowFunnel": {
          "$${TS_CERT_DOMAIN}:10000": true
        }
      }
