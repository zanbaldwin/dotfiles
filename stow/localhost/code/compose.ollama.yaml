name: 'ollama'
services:

  # Should be equivalent to:
  # docker run -d --gpus=all -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama
  ollama:
    image: 'ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429'
    restart: 'unless-stopped'
    deploy:
      resources:
        reservations:
          devices:
            - driver: 'nvidia'
              count: 'all'
              capabilities:
                - 'gpu'
    environment:
      OLLAMA_HOST: 'http://0.0.0.0:11434'
      OLLAMA_ORIGINS: '*'
    healthcheck:
      test: [ 'CMD', 'ollama', 'list' ]
    ports:
      - target: 11434
        published: 11434
        protocol: 'tcp'
        mode: 'host'
    volumes:
      - type: 'volume'
        source: 'models'
        target: '/root/.ollama'
        read_only: false

  openwebui:
    image: 'ghcr.io/open-webui/open-webui:v0.12.4@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7'
    restart: 'unless-stopped'
    environment:
      OLLAMA_BASE_URL: 'http://ollama:11434'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      ollama:
        condition: 'service_healthy'
    ports:
      - target: 8080
        published: 6984
        protocol: 'tcp'
        mode: 'host'
    volumes:
      - type: 'volume'
        source: 'openwebui'
        target: '/app/backend/data'
        read_only: false

volumes:
  models:
    driver: 'local'
  openwebui:
    driver: 'local'
