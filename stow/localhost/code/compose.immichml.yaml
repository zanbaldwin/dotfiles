name: 'immich'
services:

  machine-learning:
    image: 'ghcr.io/immich-app/immich-machine-learning:v2.3.1-cuda@sha256:723c82610d713bc9bc15d90d8426f96915c2cbd634ef5bec1bf45a098d82d81d'
    restart: 'unless-stopped'
    deploy:
      resources:
        reservations:
          devices:
            - driver: 'nvidia'
              count: 'all'
              capabilities:
                - 'gpu'
    network_mode: 'host'
    environment:
      TZ: 'Europe/Amsterdam'
    healthcheck:
      test: [ 'CMD', 'curl', '-fsSL', 'http://127.0.0.1:3003/ping' ]
      interval: '30s'
    ports:
      - target: 3003
        published: 3003
        protocol: 'tcp'
        mode: 'host'
    volumes:
      - type: 'volume'
        source: 'models'
        target: '/cache'
        read_only: false

  notifier:
    image: 'curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40'
    depends_on:
      machine-learning:
        condition: 'service_healthy'
    restart: 'no'
    config:
      - source: 'apikey'
        target: '/run/secrets/apikey'
    command: |
      curl -X'PUT'
      'https://photos.lan.zanbaldwin.com/api/jobs/smartSearch'
      -H "x-api-key: $(cat '/run/secrets/apikey')"
      -H 'Content-Type: application/json'
      -d '{"command": "resume-all"}'

volumes:
  models:
    driver: 'local'

configs:
  apikey:
    content: 'MY-KEY'
