name: 'books'
services:
  web:
    image: 'linuxserver/calibre-web:5.33.2@sha256:60f5cf63215a8511a906371ab34bff4c339d5f87c194324cb7d561845d2baae1'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETUID', 'SETGID', 'KILL']
    environment:
      TZ: 'Europe/Amsterdam'
      DOCKER_MODS: 'linuxserver/mods:universal-calibre'
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
    ports:
      - target: 8083
        published: 8083
        host_ip: '127.0.0.1'
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/mnt/tank4/books/Calibre'
        target: '/books'
        read_only: true
      - type: 'bind'
        source: '/mnt/fast/apps/calibre'
        target: '/config'
        read_only: false
