name: 'ai'
services:
  openwebui:
    image: 'ghcr.io/open-webui/open-webui:v0.12.4@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    environment:
      OLLAMA_BASE_URL: 'http://desktop.lan.zanbaldwin.com:11434'
    ports:
      - target: 8080
        published: 6984
        host_ip: '127.0.0.1'
        protocol: 'tcp'
        mode: 'host'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/openwebui'
        target: '/app/backend/data'
        read_only: false
