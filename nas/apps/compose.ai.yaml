name: 'ai'
services:
  openwebui:
    image: 'ghcr.io/open-webui/open-webui:v0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    environment:
      OLLAMA_BASE_URL: 'http://desktop.lan.zanbaldwin.com:11434'
    ports:
      - target: 8080
        published: 6984
        host_ip: '127.0.0.1'
        protocol: 'tcp'
        mode: 'host'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/openwebui'
        target: '/app/backend/data'
        read_only: false
