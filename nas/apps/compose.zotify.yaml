name: 'zotify'
services:
    zotify:
        build:
            context: '/mnt/tank4/music/Zotify'
            dockerfile_inline: |
                FROM python:3.14-slim
                RUN apt-get update \
                    && apt-get install -y --no-install-recommends ffmpeg git \
                    && rm -rf /var/lib/apt/lists/*
                RUN pip install --no-cache-dir 'git+https://github.com/Googolplexed0/zotify.git'
                # Patch: retry Session.reconnect with backoff. A refused
                # connection during reconnect otherwise kills the session.
                RUN printf '%s\n' \
                    '' \
                    'import time as _reconnect_time' \
                    '_orig_reconnect = Session.reconnect' \
                    'def _retry_reconnect(self):' \
                    '    last_err = None' \
                    '    for attempt in range(6):' \
                    '        try:' \
                    '            return _orig_reconnect(self)' \
                    '        except OSError as err:' \
                    '            last_err = err' \
                    '            self.logger.warning("Reconnect failed ({}), retry {}/5".format(err, attempt + 1))' \
                    '            _reconnect_time.sleep(min(2 ** attempt, 30))' \
                    '    raise last_err' \
                    'Session.reconnect = _retry_reconnect' \
                    >> /usr/local/lib/python3.14/site-packages/librespot/core.py \
                    && python3 -c 'import librespot.core'
                WORKDIR "/zotify"
                CMD ["/zotify/download.sh"]
        # One-shot: walks every list in /zotify/lists, then exits. Rerun to
        # resume; completed work is skipped via /zotify/state.
        restart: 'no'
        user: '1000:1000'
        deploy:
            resources:
                limits:
                    memory: '512M'
        environment:
            TZ: 'Europe/Amsterdam'
            # Zotify writes config.json to $HOME, which must be writable
            # when running as a non-root user.
            HOME: '/tmp'
        volumes:
            - type: 'bind'
              source: '/mnt/tank4/music/Zotify'
              target: '/zotify'
              read_only: false
