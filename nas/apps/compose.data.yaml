name: 'data'
services:
    postgres:
        image: 'tensorchord/vchord-postgres:pg18-v0.5.3'
        restart: 'unless-stopped'
        healthcheck:
            test: ['CMD', 'bash', '/usr/local/bin/healthcheck.sh']
            interval: '30s'
            timeout: '10s'
            retries: 3
            start_period: '40s'
        shm_size: '256mb'
        deploy:
            resources:
                limits:
                    memory: '1G'
        networks:
            database:
                aliases: ['database']
        environment:
            POSTGRES_PASSWORD_FILE: '/run/secrets/dbpass'
            POSTGRES_USER: 'main'
            POSTGRES_DB: 'main'
            POSTGRES_INITDB_ARGS: '--data-checksums'
        secrets:
            - 'dbpass'
        configs:
            - source: 'initdb'
              target: '/docker-entrypoint-initdb.d/enable-vectorchord.sql'
            - source: 'dbconfig'
              target: '/etc/postgresql/postgresql.conf'
            - source: 'dbhealth'
              target: '/usr/local/bin/healthcheck.sh'
        # Don't define port mappings as we only want to be available to other services inside Docker.
        ports: []
        volumes:
            - type: 'bind'
              source: '/mnt/fast/apps/postgres'
              # As of Postgres 18+ the recommendation is to mount `/var/lib/postgres`
              # as the data directory will now be named according to the major version
              # to assist in upgrade migrations.
              target: '/var/lib/postgresql'
              read_only: false
        command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']

    valkey:
        image: 'valkey/valkey:9.1.0-alpine'
        restart: 'unless-stopped'
        deploy:
            resources:
                limits:
                    memory: '256M'
        networks:
            cache:
                aliases: ['cache']
        healthcheck:
            test: ['CMD', 'valkey-cli', '--raw', 'ping']
            interval: '30s'
            timeout: '10s'
            retries: 3
            start_period: '40s'
        configs:
            - source: 'valkey'
              target: '/etc/valkey/valkey.conf'
        # Don't define port mappings as we only want to be available to other services inside Docker.
        ports: []
        command: ['valkey-server', '/etc/valkey/valkey.conf']

    garage:
        image: 'dxflrs/garage:v2.0.0'
        restart: 'unless-stopped'
        networks:
            s3:
                aliases: ['s3', 'garage']
        secrets:
            - 'garage_rpc_secret'
            - 'garage_admin_token'
            - 'garage_metrics_token'
        configs:
            - source: 's3config'
              target: '/etc/garage.toml'
        volumes:
            - type: 'bind'
              source: '/mnt/fast/apps/garage'
              target: '/var/lib/garage/meta'
              read_only: false
            - type: 'bind'
              source: '/mnt/tank4/buckets'
              target: '/var/lib/garage/data'
              read_only: false
        ports:
            - target: 3900
              published: 3900
              protocol: 'tcp'
        deploy:
            resources:
                limits:
                    # Generous ceiling; a single-node build-cache workload will
                    # realistically sit in the tens of MB. This is a blast-radius
                    # cap, not a sizing recommendation.
                    memory: '512M'
                reservations:
                    memory: '64M'
        healthcheck:
            test: ['CMD', '/garage', 'status']
            interval: '30s'
            timeout: '5s'
            retries: 3
            start_period: '10s'
    webui:
        image: 'noooste/garage-ui:v0.10.0'
        restart: 'unless-stopped'
        depends_on:
            garage:
                condition: 'service_healthy'
        networks: ['s3']
        environment:
            GARAGE_UI_GARAGE_ENDPOINT: 'http://garage:3900'
            GARAGE_UI_GARAGE_ADMIN_ENDPOINT: 'http://garage:3903'
            GARAGE_UI_GARAGE_ADMIN_TOKEN_FILE: '/run/secrets/garage_admin_token'
            GARAGE_UI_AUTH_ADMIN_USERNAME: 'zan'
            GARAGE_UI_AUTH_ADMIN_PASSWORD_FILE: '/run/secrets/garage_ui_password'
        secrets:
            - 'garage_admin_token'
            - 'garage_ui_password'
        ports:
            - target: 8080
              published: 3909
              protocol: 'tcp'
        deploy:
            resources:
                limits:
                    memory: '128M'

networks:
    cache:
        name: 'cache'
        driver: 'bridge'
        attachable: true
    database:
        name: 'database'
        driver: 'bridge'
        attachable: true
    s3:
        name: 's3'
        driver: 'bridge'
        attachable: true

secrets:
    dbpass:
        file: '/mnt/tank4/secrets/postgres/main'
    garage_rpc_secret:
        file: '/mnt/tank4/secrets/garage/rpc_secret'
    garage_admin_token:
        file: '/mnt/tank4/secrets/garage/admin_token'
    garage_metrics_token:
        file: '/mnt/tank4/secrets/garage/metrics_token'
    garage_ui_password:
        file: '/mnt/tank4/secrets/garage/ui_password'

configs:
    initdb:
        content: |
            CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
    dbconfig:
        content: |
            listen_addresses = '*'
            ## Immich's HDD Postgres Settings
            shared_preload_libraries = 'vchord.so'
            search_path = '"$$user", public'
            wal_compression = on
            autovacuum_vacuum_cost_limit = 1000
            ## Zan's "Not On My Machine" Settings
            max_connections = 35
            shared_buffers = 256MB
            effective_cache_size = 768MB
            work_mem = 2MB
            maintenance_work_mem = 64MB
            temp_buffers = 4MB
            max_worker_processes = 4
            max_parallel_workers = 4
            max_parallel_workers_per_gather = 1
            max_parallel_maintenance_workers = 1
            autovacuum = on
            autovacuum_naptime = 30s
            autovacuum_vacuum_scale_factor = 0.2
            autovacuum_analyze_scale_factor = 0.1
            autovacuum_max_workers = 2
            autovacuum_work_mem = 32MB
            wal_level = replica
            max_wal_size = 512MB
            min_wal_size = 64MB
            checkpoint_timeout = 20min
            checkpoint_completion_target = 0.9
            # "off" should be fine on ZFS (otherwise use "local").
            synchronous_commit = local
            log_min_duration_statement = 250ms
            log_checkpoints = off
            log_autovacuum_min_duration = 1s
            log_statement = 'none'
    dbhealth:
        content: |
            #!/usr/bin/env bash
            read_env_or_file() {
                local VAR_NAME="$$1"
                local FILE_VAR_NAME="$${VAR_NAME}_FILE"
                if [[ -n "$${!FILE_VAR_NAME}" && -f "$${!FILE_VAR_NAME}" && -s "$${!FILE_VAR_NAME}" ]]; then
                    cat "$${!FILE_VAR_NAME}"
                else
                    echo "$${!VAR_NAME}"
                fi
            }
            POSTGRES_DB=$$(read_env_or_file "POSTGRES_DB")
            POSTGRES_USER=$$(read_env_or_file "POSTGRES_USER")
            POSTGRES_PASSWORD=$$(read_env_or_file "POSTGRES_PASSWORD")
            export POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD
            pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit $?;
            CHKSUM_ERROR_COUNT="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
            if [ "$${CHKSUM_ERROR_COUNT}" != '0' ]; then
              echo "checksum failure count is $${CHKSUM_ERROR_COUNT}";
              exit 1
            fi
    valkey:
        content: |
            appendonly yes
            appendfsync everysec
            auto-aof-rewrite-percentage 100
            auto-aof-rewrite-min-size 32mb
            save 60 100
            maxmemory 180mb
            maxmemory-policy allkeys-lru
    s3config:
        content: |
            # Single-node Garage config.
            # Generate the three secrets below with: openssl rand -hex 32
            metadata_dir = "/var/lib/garage/meta"
            data_dir = "/var/lib/garage/data"
            db_engine = "sqlite"
            # Periodic snapshot of the metadata DB alongside the data.
            # Cheap insurance that makes restic/Backrest snapshots of the meta
            # dir consistent without stopping the container.
            metadata_auto_snapshot_interval = "6h"
            # Single node: one copy of everything. This is a supported config,
            # not a degraded cluster.
            replication_factor = 1
            # zstd level for data at rest. 2 is near-free CPU-wise.
            compression_level = 2
            rpc_bind_addr = "[::]:3901"
            # Compose service name; only ever resolved inside the compose network.
            rpc_public_addr = "garage:3901"
            rpc_secret_file = "/run/secrets/garage_rpc_secret"
            [s3_api]
            s3_region = "garage"
            api_bind_addr = "[::]:3900"
            # Suffix for vhost-style bucket addressing. Path-style
            # (http://host:3900/bucket/key) works regardless, which is what
            # kache/sccache use, so this rarely matters in practice.
            root_domain = ".s3.lan.zanbaldwin.com"
            [admin]
            api_bind_addr = "[::]:3903"
            admin_token_file = "/run/secrets/garage_admin_token"
            metrics_token_file = "/run/secrets/garage_metrics_token"
