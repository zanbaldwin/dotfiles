name: 'git'
services:
  # Database Setup
  # ==============
  #   CREATE USER forgejo WITH ENCRYPTED PASSWORD '<password>';
  #   CREATE DATABASE forgejo;
  #   \c forgejo
  #   ALTER DATABASE forgejo OWNER TO forgejo;
  #   ALTER SCHEMA public OWNER TO forgejo;
  #   GRANT USAGE, CREATE ON SCHEMA public TO forgejo;
  forgejo:
    image: 'codeberg.org/forgejo/forgejo:15.0.12@sha256:9a95f97ccfdf374472c96d958f6e3788d54076e0349fdce7af56ba8541d066b2'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETUID', 'SETGID', 'KILL', 'SYS_CHROOT']
    networks:
      - 'default'
      - 'database'
    environment:
      TZ: 'Europe/Amsterdam'
      USER_UID: '${PUID:-1000}'
      USER_GID: '${PGID:-1000}'
      # Instance posture. FORGEJO__<section>__<KEY> env vars are written into
      # app.ini on startup (environment-to-ini), so single keys are overridden
      # without templating the whole config.
      FORGEJO__database__DB_TYPE: 'postgres'
      FORGEJO__database__HOST: 'postgres:5432'
      FORGEJO__database__NAME: 'forgejo'
      FORGEJO__database__USER: 'forgejo'
      FORGEJO__database__PASSWD__FILE: '/run/secrets/dbpass'
      # Allow anonymous clients to reach the instance so the container registry
      # can issue anonymous pull tokens for PUBLIC packages.
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: 'false'
      FORGEJO__service__DEFAULT_ORG_VISIBILITY: 'limited'
      FORGEJO__service__DEFAULT_USER_VISIBILITY: 'limited'
    configs:
      # Config is actually loaded from `/data/gitea/conf/app.ini`,
      # but it's good to keep a reference of what should be.
      - source: 'forgejo'
        target: '/etc/forgejo/app.ini'
    secrets:
      - 'dbpass'
    ports:
      - target: 3000
        published: 3645
        host_ip: '127.0.0.1'
        protocol: 'tcp'
      - target: 22
        published: 484
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/forgejo/server'
        target: '/data'
        read_only: false
      - type: 'bind'
        source: '/mnt/tank4/code'
        target: '/data/git/repositories'
        read_only: false
      - type: 'bind'
        source: '/etc/localtime'
        target: '/etc/localtime'
        read_only: true
      - type: 'bind'
        source: '/etc/timezone'
        target: '/etc/timezone'
        read_only: true

networks:
  default: {}
  database:
    external: true

secrets:
  dbpass:
    file: '/mnt/tank4/secrets/postgres/forgejo'

configs:
  forgejo:
    content: ''
