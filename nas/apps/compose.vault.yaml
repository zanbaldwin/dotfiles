name: 'vault'
services:
  # Database Setup
  # ==============
  #   CREATE USER immich WITH ENCRYPTED PASSWORD '<password>';
  #   CREATE DATABASE immich;
  #   \c immich
  #   ALTER DATABASE immich OWNER TO immich;
  server:
    image: 'vaultwarden/server:1.37.5-alpine@sha256:bbe684a02d6b0db54256ff88eac9754f4519284a7b26314afc241fd7d0918191'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    networks: ['default', 'proxy', 'database']
    environment:
      DATABASE_URL_FILE: '/run/secrets/vaultdsn'
    secrets:
      - 'vaultdsn'
    labels:
      caddy: 'vault.wan.zanbaldwin.com, vault.lan.zanbaldwin.com'
      caddy.import: 'app {{upstreams 80}}'
    configs:
      - source: 'vaultwarden'
        target: '/data/config.json'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/vaultwarden'
        target: '/data'
        read_only: false

networks:
  default: {}
  database:
    external: true
  proxy:
    external: true

secrets:
  vaultdsn:
    file: '/mnt/tank4/secrets/postgres/vault_dsn'

configs:
  vaultwarden:
    content: |
      {
        "domain": "https://vault.wan.zanbaldwin.com",
        "signups_allowed": false,
        "sends_allowed": false,
        "invitations_allowed": true,
        "emergency_access_allowed": true,
        "email_change_allowed": true,
        "password_hints_allowed": false,
        "show_password_hint": false,
        "sso_enabled": false,
        "sso_only": false,
        "_enable_yubico": false,
        "_enable_duo": false,
        "_enable_smtp": false
      }
