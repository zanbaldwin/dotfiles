name: 'music'
services:
    navidrome:
        image: 'deluan/navidrome:0.63.2'
        restart: 'unless-stopped'
        user: '1000:1000'
        environment:
            TZ: 'Europe/Amsterdam'
        configs:
            - source: 'navidrome'
              target: '/data/navidrome.toml'
        ports:
            - target: 4533
              published: 4533
              protocol: 'tcp'
        volumes:
            - type: 'bind'
              source: '/mnt/fast/apps/navidrome'
              target: '/data'
              read_only: false
            - type: 'bind'
              source: '/mnt/tank4/music'
              target: '/music'
              read_only: true
            - type: 'bind'
              source: '/mnt/tank4/books/Audible'
              target: '/books'
              read_only: true
        command: ['--configfile', '/data/navidrome.toml']

configs:
    navidrome:
        content: |
            LogLevel = 'WARNING'
            Scanner.Schedule = '@every 24h'
            MusicFolder = '/music'
            DataFolder = '/data'
            CacheFolder = '/tmp'
            Address = '0.0.0.0'
            BaseUrl = 'https://music.lan.zanbaldwin.com'
            Port = 4533
            EnableInsightsCollector = false
            Tags.Artist.Split = [' / ', ' feat. ', ' feat ', ' ft. ', ' ft ', '; ', ', ']
            Tags.AlbumArtist.Split = [' / ', ' feat. ', ' feat ', ' ft. ', ' ft ', '; ', ', ']
            Scanner.ArtistSplitExceptions = ['ABBA (Björn, Benny, Agnetha & Frida)', 'Blood, Sweat & Tears', 'Woe, Is Me', 'The Chapel Choir of Pembroke College, Cambridge', 'Mr. Garrison, The 3rd Grade Teacher']
