name: 'ai'
services:
  openwebui:
    image: 'ghcr.io/open-webui/open-webui:v0.13.4@sha256:d5168bfbc28609eff5bea1b438dd864cf64d185cf6582c02244865e18385b901'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    entrypoint: ['/bin/sh', '/secrets-exec.sh']
    command: ['bash', 'start.sh']
    configs:
      - source: 'secretsexec'
        target: '/secrets-exec.sh'
    secrets:
      - source: 'client_id'
        target: 'OAUTH_CLIENT_ID'
      - source: 'client_secret'
        target: 'OAUTH_CLIENT_SECRET'
    environment:
      OLLAMA_BASE_URL: 'http://desktop.lan.zanbaldwin.com:11434'
      OAUTH_PROVIDER_NAME: 'PocketID'
      OPENID_PROVIDER_URL: 'https://auth.wan.zanbaldwin.com/.well-known/openid-configuration'
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: 'true'
    ports:
      - target: 8080
        published: 6984
        host_ip: '127.0.0.1'
        protocol: 'tcp'
        mode: 'host'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/openwebui'
        target: '/app/backend/data'
        read_only: false

secrets:
  client_id:
    file: '/mnt/tank4/secrets/openwebui/client_id'
  client_secret:
    file: '/mnt/tank4/secrets/openwebui/client_secret'

configs:
  secretsexec:
    # Exports every mounted secret as an env var named after its file (the
    # service-level `target:` name), then hands off to the real entrypoint.
    content: |
      #!/bin/sh
      set -eu
      for file in /run/secrets/*; do
          [ -f "$${file}" ] || continue
          export "$$(basename "$${file}")=$$(cat "$${file}")"
      done
      exec "$$@"
