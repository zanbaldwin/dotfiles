name: 'immich'
services:

  machine-learning:
    image: 'ghcr.io/immich-app/immich-machine-learning:v3.3.5-cuda@sha256:ba820b5b2ce199ef085bd5a42f092218f16994149019c5ab252bf387c22a99b4'
    restart: 'unless-stopped'
    deploy:
      resources:
        reservations:
          devices:
            - driver: 'nvidia'
              count: 'all'
              capabilities:
                - 'gpu'
    network_mode: 'host'
    environment:
      TZ: 'Europe/Amsterdam'
    healthcheck:
      test: [ 'CMD', 'curl', '-fsSL', 'http://127.0.0.1:3003/ping' ]
      interval: '30s'
    ports:
      - target: 3003
        published: 3003
        protocol: 'tcp'
        mode: 'host'
    volumes:
      - type: 'volume'
        source: 'models'
        target: '/cache'
        read_only: false

  notifier:
    image: 'curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac'
    depends_on:
      machine-learning:
        condition: 'service_healthy'
    restart: 'no'
    config:
      - source: 'apikey'
        target: '/run/secrets/apikey'
    command: |
      curl -X'PUT'
      'https://photos.lan.zanbaldwin.com/api/jobs/smartSearch'
      -H "x-api-key: $(cat '/run/secrets/apikey')"
      -H 'Content-Type: application/json'
      -d '{"command": "resume-all"}'

volumes:
  models:
    driver: 'local'

configs:
  apikey:
    content: 'MY-KEY'
