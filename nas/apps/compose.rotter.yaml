name: 'rotter'
services:

  rotter:
    image: 'alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf'
    restart: 'no'
    user: '1000:1000'
    deploy:
      resources:
        limits:
          memory: '384M'
    stop_grace_period: '20m'
    command: ['/rotter/bin/rotter', 'process']
    secrets:
      - 'credentials'
      - 'serve_token'
    environment:
      TZ: 'Europe/Amsterdam'
      ROTTER_CREDENTIALS_FILE: '/run/secrets/credentials'
      ROTTER_EXPORT_PATH_PREFIX: '../'
      ROTTER_MUSIC: '/music'
      ROTTER_PLAYLISTS: '/music/playlists'
      ROTTER_ROOT: '/rotter'
      ROTTER_SERVE: '0.0.0.0:7688'
      ROTTER_SERVE_TOKEN_FILE: '/run/secrets/serve_token'
    networks: ['default', 'proxy']
    labels:
      caddy: 'rotter.wan.zanbaldwin.com, rotter.lan.zanbaldwin.com'
      caddy.import: 'app {{upstreams 7688}}'
    volumes:
      - read_only: false
        source: '/mnt/fast/apps/rotter'
        target: '/rotter'
        type: 'bind'
      - read_only: false
        source: '/mnt/tank4/music/modern'
        target: '/music'
        type: 'bind'

networks:
  default: {}
  proxy:
    external: true

secrets:
  credentials:
    file: '/mnt/tank4/secrets/rotter/credentials.json'
  serve_token:
    file: '/mnt/tank4/secrets/rotter/serve_token'

configs:
  secretsexec:
    # Exports every mounted secret as an env var named after its file (the
    # service-level `target:` name), then hands off to the real entrypoint.
    content: |
      #!/bin/sh
      set -eu
      for file in /run/secrets/*; do
          [ -f "$${file}" ] || continue
          export "$$(basename "$${file}")=$$(cat "$${file}")"
      done
      exec "$$@"
