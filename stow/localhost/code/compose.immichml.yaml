name: 'immich'
services:

  machine-learning:
    image: 'ghcr.io/immich-app/immich-machine-learning:v3.4.1-cuda@sha256:aaa7eb0f47e3815a1c575790085474e01c129df7c47ffbbcbfd80947d4c41339'
    restart: 'unless-stopped'
    deploy:
      resources:
        reservations:
          devices:
            - driver: 'nvidia'
              count: 'all'
              capabilities:
                - 'gpu'
    network_mode: 'host'
    environment:
      TZ: 'Europe/Amsterdam'
    healthcheck:
      test: [ 'CMD', 'curl', '-fsSL', 'http://127.0.0.1:3003/ping' ]
      interval: '30s'
    ports:
      - target: 3003
        published: 3003
        protocol: 'tcp'
        mode: 'host'
    volumes:
      - type: 'volume'
        source: 'models'
        target: '/cache'
        read_only: false

  notifier:
    image: 'curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93'
    depends_on:
      machine-learning:
        condition: 'service_healthy'
    restart: 'no'
    config:
      - source: 'apikey'
        target: '/run/secrets/apikey'
    command: |
      curl -X'PUT'
      'https://photos.lan.zanbaldwin.com/api/jobs/smartSearch'
      -H "x-api-key: $(cat '/run/secrets/apikey')"
      -H 'Content-Type: application/json'
      -d '{"command": "resume-all"}'

volumes:
  models:
    driver: 'local'

configs:
  apikey:
    content: 'MY-KEY'
