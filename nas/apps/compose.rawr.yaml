name: 'rawr'
services:
  web:
    image: 'alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf'
    restart: 'unless-stopped'
    user: '1000:1000'
    cap_drop: ['ALL']
    command: ['/opt/rawr/rawr-web', '--bind', '0.0.0.0:7297']
    environment:
      RAWR_CONFIG: '/library/rawr.toml'
      RAWR__LIBRARY__CACHE: '/opt/rawr/cache.db'
      # Override the path configured for Desktop use.
      RAWR__LIBRARY__TARGETS__IMPORT: 'nfs'
      RAWR__TARGETS__NFS__DIRECTORY: '/library'
      RAWR__LIBRARY__TARGETS__EXPORT: 'orbit'
      RAWR__TARGETS__ORBIT__DIRECTORY: '/opt/rawr/orbit'
      RAWR__LIBRARY__STYLES__EPUB: '["builtin:epub.css"]'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/rawr'
        target: '/opt/rawr'
        read_only: false
      - type: 'bind'
        source: '/mnt/tank4/books/AO3'
        target: '/library'
        read_only: false
    networks: ['default', 'proxy']
    labels:
      caddy: 'ao3.wan.zanbaldwin.com, ao3.lan.zanbaldwin.com, rawr.wan.zanbaldwin.com, rawr.lan.zanbaldwin.com'
      caddy.import: 'app {{upstreams 7297}}'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7297/api/v1/health']
      interval: '60s'
      start_period: '10s'

networks:
  default: {}
  proxy:
    external: true
