name: 'books'
services:

  # Database Setup
  # ==============
  #   CREATE USER bookorbit WITH ENCRYPTED PASSWORD '<password>';
  #   CREATE DATABASE bookorbit;
  #   \c bookorbit
  #   ALTER DATABASE bookorbit OWNER TO bookorbit;
  #   ALTER SCHEMA public OWNER TO bookorbit;
  #   GRANT USAGE, CREATE ON SCHEMA public TO bookorbit;
  #   CREATE EXTENSION IF NOT EXISTS vector;
  #   CREATE EXTENSION IF NOT EXISTS pg_trgm;
  #   CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
  #
  # Secrets: `openssl rand -hex 32 | tr -d '\n' | sudo tee '/mnt/tank4/secrets/bookorbit/<name>' >'/dev/null'`
  # for both `jwt_secret` and `setup_token`.
  bookorbit:
    image: 'ghcr.io/bookorbit/bookorbit:3.10.0@sha256:507a84c08c100244c27bce68ce59670da5dc8c3bc9054dd4aea3630977c42885'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETUID', 'SETGID']
    security_opt: ['no-new-privileges:true']
    read_only: true
    deploy:
      resources:
        limits:
          memory: '1G'
    networks:
      - 'default'
      - 'database'
      - 'proxy'
    environment:
      TZ: 'Europe/Amsterdam'
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      NODE_ENV: 'production'
      PORT: '3000'
      APP_URL: 'https://books.wan.zanbaldwin.com'
      POSTGRES_HOST: 'postgres'
      POSTGRES_PORT: '5432'
      POSTGRES_USER: 'bookorbit'
      POSTGRES_DB: 'bookorbit'
      POSTGRES_PASSWORD_FILE: '/run/secrets/dbpass'
      JWT_SECRET_FILE: '/run/secrets/jwt_secret'
      SETUP_BOOTSTRAP_TOKEN_FILE: '/run/secrets/setup_token'
      # The OIDC provider itself is configured in the web UI and stored in the
      # database. PocketID resolves to a Tailscale (100.64.0.0/10) address, which
      # BookOrbit rejects as an OIDC issuer unless this is enabled.
      OIDC_ALLOW_LOCAL_ISSUERS: 'true'
      AI_ENCRYPTION_KEY_FILE: '/run/secrets/encryption_key'
    secrets:
      - 'dbpass'
      - 'jwt_secret'
      - 'setup_token'
      - 'encryption_key'
    labels:
      caddy: 'books.wan.zanbaldwin.com, books.lan.zanbaldwin.com'
      caddy.import: 'app {{upstreams 3000}}'
    volumes:
      - type: 'bind'
        source: '/mnt/tank4/books/Calibre'
        target: '/books'
        read_only: true
      - type: 'bind'
        source: '/mnt/tank4/books/Audiobooks'
        target: '/audiobooks'
        read_only: true
      - type: 'bind'
        source: '/mnt/fast/apps/bookorbit'
        target: '/data'
        read_only: false
      - type: 'tmpfs'
        target: '/tmp'
        read_only: false

networks:
  default: {}
  database:
    external: true
  proxy:
    external: true

secrets:
  dbpass:
    file: '/mnt/tank4/secrets/postgres/bookorbit'
  jwt_secret:
    file: '/mnt/tank4/secrets/bookorbit/jwt_secret'
  setup_token:
    file: '/mnt/tank4/secrets/bookorbit/setup_token'
  encryption_key:
    file: '/mnt/tank4/secrets/bookorbit/encryption_key'
