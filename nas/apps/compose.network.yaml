name: 'network'
services:

  tailscale:
    image: 'tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d'
    restart: 'unless-stopped'
    network_mode: 'host'
    environment:
      TS_AUTHKEY: 'file:/run/secrets/authkey'
      TS_STATE_DIR: '/var/lib/tailscale'
      TS_AUTH_ONCE: 'true'
      TS_ENABLE_HEALTH_CHECK: 'true'
      TS_LOCAL_ADDR_PORT: '0.0.0.0:8575'
      # To forward to subnets, use kernel networking with the following options:
      # # /etc/sysctl.d/99-tailscale.conf
      # net.ipv4.ip_forward = 1
      # net.ipv6.conf.all.forwarding = 1
      TS_ROUTES: '192.168.1.0/24'
      TS_EXTRA_ARGS: '--advertise-exit-node'
      TS_USERSPACE: 'false'
      TS_NO_LOGS_NO_SUPPORT: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q "http://127.0.0.1:8575/healthz"']
      interval: '30s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
    secrets:
      - 'authkey'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/tailscale'
        target: '/var/lib/tailscale'
        read_only: false
    devices:
      - '/dev/net/tun:/dev/net/tun'
    cap_drop: ['ALL']
    cap_add: ['NET_ADMIN', 'NET_RAW', 'SYS_MODULE']

  manager:
    image: 'jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE', 'SETUID', 'SETGID']
    # Don't bother with extra_hosts, Nginx does not use it. Use host network instead.
    network_mode: 'host'
    healthcheck:
      test: ['CMD', '/bin/check-health']
      interval: '10s'
      timeout: '3s'
    secrets:
      - 'cloudflare'
    # Technically these are ignored in "host" network mode,
    # but always good to reference them in config.
    ports:
      - target: 80
        published: 80
        protocol: 'tcp'
      - target: 443
        published: 443
        protocol: 'tcp'
      - target: 81
        published: 81
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/proxy/config'
        target: '/data'
        read_only: false
      - type: 'bind'
        source: '/mnt/fast/apps/proxy/certs'
        target: '/etc/letsencrypt'
        read_only: false

  # Database Setup
  # ==============
  #   CREATE USER pocketid WITH ENCRYPTED PASSWORD '<password>';
  #   CREATE DATABASE pocketid;
  #   \c pocketid
  #   ALTER DATABASE pocketid OWNER TO pocketid;
  #   ALTER SCHEMA public OWNER TO pocketid;
  #
  # Secrets:
  #   printf 'postgres://pocketid:<password>@postgres:5432/pocketid' > /mnt/tank4/secrets/pocketid/dsn
  #   openssl rand -base64 32 | tr -d '\n' > /mnt/tank4/secrets/pocketid/encryption_key
  #
  # Losing `encryption_key` makes the stored signing keys unreadable.
  # Visit /setup straight away to register the admin passkey.
  pocketid:
    image: 'ghcr.io/pocket-id/pocket-id:v2.19.1-distroless@sha256:d035c9c229304cfd25f97a79b2da00bde9cf942abbd70430d452a95420e2836b'
    restart: 'unless-stopped'
    user: '1000:1000'
    cap_drop: ['ALL']
    networks:
      - 'database'
    environment:
      TZ: 'Europe/Amsterdam'
      APP_URL: 'https://auth.wan.zanbaldwin.com'
      TRUST_PROXY: 'true'
      ANALYTICS_DISABLED: 'true'
      DB_CONNECTION_STRING_FILE: '/run/secrets/pocketid_dsn'
      ENCRYPTION_KEY_FILE: '/run/secrets/pocketid_encryption_key'
    secrets:
      - 'pocketid_dsn'
      - 'pocketid_encryption_key'
    healthcheck:
      test: ['CMD', '/app/pocket-id', 'healthcheck']
      interval: '90s'
      timeout: '5s'
      retries: 3
      start_period: '10s'
    ports:
      - target: 1411
        published: 2884
        host_ip: '127.0.0.1'
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/mnt/fast/apps/pocketid'
        target: '/app/data'
        read_only: false

networks:
  database:
    external: true

secrets:
  authkey:
    file: '/mnt/tank4/secrets/tailscale'
  cloudflare:
    file: '/mnt/tank4/secrets/cloudflare'
  pocketid_dsn:
    file: '/mnt/tank4/secrets/pocketid/dsn'
  pocketid_encryption_key:
    file: '/mnt/tank4/secrets/pocketid/encryption_key'
