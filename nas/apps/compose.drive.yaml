name: 'drive'
services:

  # Web file manager, replacing the old read-only Next Explorer - it reuses that
  # service's port and domain. The '-stable-slim' tag drops ffmpeg (25MB vs
  # 83MB) at the cost of video and office thumbnails.
  # The image ships its own HEALTHCHECK against /health, so none is declared.
  files:
    image: 'gtstef/filebrowser:2.1.0-stable@sha256:17de8d0ac6a6bcfd5ef9aca43d6c0aa2fd031a07d6ee9b8a3b7c6c646efe35bf'
    restart: 'unless-stopped'
    cap_drop: ['ALL']
    # The image's own user is already uid 1000, matching OpenCloud, so files
    # created from the web UI get ownership the posix driver expects.
    user: '1000:1000'
    deploy:
      resources:
        limits:
          memory: '512M'
    entrypoint: ['/bin/sh', '/secrets-exec.sh', './filebrowser']
    configs:
      - source: 'filebrowser'
        target: '/config.yaml'
      - source: 'secretsexec'
        target: '/secrets-exec.sh'
    secrets:
      - source: 'client_id'
        target: 'FILEBROWSER_OIDC_CLIENT_ID'
      - source: 'client_secret'
        target: 'FILEBROWSER_OIDC_CLIENT_SECRET'
    environment:
      TZ: 'Europe/Amsterdam'
      # Defaults to /home/filebrowser/data/config.yaml, i.e. inside the state
      # directory. Point it at the inlined config instead, so the state
      # directory holds only the sqlite index.
      FILEBROWSER_CONFIG: '/config.yaml'
    volumes:
      # Sqlite search index and app state.
      - type: 'bind'
        source: '/mnt/fast/apps/filebrowser'
        target: '/home/filebrowser/data'
        read_only: false
      - type: 'bind'
        source: '/mnt/tank4/drive'
        target: '/drive'
        read_only: false
    networks: ['default', 'proxy']
    labels:
      caddy: 'drive.wan.zanbaldwin.com, drive.lan.zanbaldwin.com, files.wan.zanbaldwin.com, files.lan.zanbaldwin.com'
      caddy.import: 'app {{upstreams 80}}'

networks:
  default: {}
  proxy:
    external: true

secrets:
  client_id:
    file: '/mnt/tank4/secrets/filebrowser/client_id'
  client_secret:
    file: '/mnt/tank4/secrets/filebrowser/client_secret'

configs:
  secretsexec:
    # Exports every mounted secret as an env var named after its file (the
    # service-level `target:` name), then hands off to the real entrypoint.
    content: |
      #!/bin/sh
      set -eu
      for file in /run/secrets/*; do
          [ -f "$${file}" ] || continue
          export "$$(basename "$${file}")=$$(cat "$${file}")"
      done
      exec "$$@"
  # No credentials here: the initial admin is created by the binary on first
  # run, not declared in config, so this is safe to keep in git.
  filebrowser:
    content: |
      http:
        port: 80
        baseURL: '/'
        trustProxyHeaders: true
      server:
        logging:
          - levels: 'info'
        sources:
          - path: '/drive'
            name: 'Drive'
            config:
              rules:
                # OpenCloud's posix driver keeps ~2,750 metadata files under
                # .oc-nodes and upload staging in .oc-tmp, both at the space
                # root. Without this they get indexed and pollute search.
                - folderStartsWith: '.oc-'
                - folderStartsWith: '.Trash'
      auth:
        methods:
          password:
            enabled: true
            signup: false
          passkey:
            enabled: false
          oidc:
            enabled: true
            issuerUrl: 'https://auth.wan.zanbaldwin.com'
